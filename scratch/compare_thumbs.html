<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compare Thumb Sizes</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #0b1320;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      width: 500px;
      background: rgba(15, 23, 42, 0.6);
      padding: 16px;
      border-radius: 12px;
    }
    .track {
      height: 6px;
      position: relative;
      flex: 1;
      border-radius: 9999px;
      background: rgba(4, 18, 30, 0.45);
      border: 1px solid rgba(186, 230, 253, 0.3);
    }
    .fill {
      position: absolute;
      top: 0; bottom: 0; left: 0; width: 40%;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(14, 165, 233, 0.78), rgba(56, 189, 248, 0.88));
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .thumb-base {
      position: absolute;
      left: 40%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: none;
      outline: none;
      background:
        radial-gradient(ellipse 42% 18% at 35% 16%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.18) 45%, transparent 75%),
        radial-gradient(ellipse 38% 16% at 65% 84%, rgba(255, 255, 255, 0.3) 0%, rgba(186, 230, 253, 0.1) 40%, transparent 75%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.04) 0%, rgba(56, 189, 248, 0.08) 60%, rgba(14, 165, 233, 0.18) 85%, rgba(2, 44, 75, 0.22) 100%);
      backdrop-filter: blur(2px) contrast(115%) brightness(118%) saturate(135%);
      box-shadow:
        inset 0 1px 1.5px rgba(255, 255, 255, 0.45),
        inset 0 -0.5px 1px rgba(255, 255, 255, 0.2),
        0 0 8px rgba(56, 189, 248, 0.4),
        0 1px 3px rgba(56, 189, 248, 0.2);
    }
    .t-95 { width: 9.5px; height: 9.5px; }
    .t-11 { width: 11px; height: 11px; }
    .t-12 { width: 12.5px; height: 12.5px; }
  </style>
</head>
<body>
  <div class="row">
    <span style="width: 140px;">Exact 9.5px (same):</span>
    <div class="track">
      <div class="fill"></div>
      <div class="thumb-base t-95"></div>
    </div>
  </div>
  <div class="row">
    <span style="width: 140px;">11px (proportional):</span>
    <div class="track">
      <div class="fill"></div>
      <div class="thumb-base t-11"></div>
    </div>
  </div>
  <div class="row">
    <span style="width: 140px;">12.5px:</span>
    <div class="track">
      <div class="fill"></div>
      <div class="thumb-base t-12"></div>
    </div>
  </div>
</body>
</html>
