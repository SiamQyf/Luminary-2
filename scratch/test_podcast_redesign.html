<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #0c0e14; color: #fff; font-family: sans-serif; padding: 40px; }
.card {
  background: #141721;
  border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 30px;
  max-width: 800px;
}
.title { font-size: 14px; font-weight: 600; color: #fbbf24; margin-bottom: 16px; }
.seekbar-row {
  display: flex;
  align-items: center;
  position: relative;
  height: 24px;
  margin-bottom: 20px;
}
.seekbar-track {
  position: relative;
  width: 100%;
  height: 9px;
  background: rgba(255, 255, 255, 0.3);
}
.seekbar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 42%;
  background: linear-gradient(90deg, #d97706 0%, #f59e0b 50%, #fbbf24 100%);
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.85);
}
.playhead-needle {
  position: absolute;
  left: 42%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 15px;
  background: #fff;
  border-radius: 1px;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.95), 0 1px 3px rgba(0, 0, 0, 0.7);
  z-index: 10;
}

.vol-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(20, 20, 24, 0.9);
  border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: 9999px;
  padding: 6px 14px 6px 10px;
}
.vol-icon {
  width: 18px;
  height: 18px;
  fill: #fbbf24;
}
.vol-track-wrap {
  width: 65px;
  height: 9px;
  position: relative;
}
.vol-track {
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.3);
  position: relative;
}
.vol-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 70%;
  background: linear-gradient(90deg, #d97706 0%, #f59e0b 60%, #fbbf24 100%);
  box-shadow: 0 0 6px rgba(245, 158, 11, 0.8);
}
.vol-thumb {
  position: absolute;
  left: 70%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 13px;
  background: #fff;
  border-radius: 1px;
  box-shadow: 0 0 6px rgba(245, 158, 11, 0.95);
  z-index: 5;
}
</style>
</head>
