    .ef-tw.no-pieces .ef-tw__pieces { display: none; }
    @keyframes ef-tw-f1 { 0%, 100% { transform: translate3d(0, 0, 0) rotate(-12deg); } 50% { transform: translate3d(8px, -14px, 0) rotate(-4deg); } }
    @keyframes ef-tw-f2 { 0%, 100% { transform: translate3d(0, 0, 0) rotate(8deg); } 50% { transform: translate3d(-12px, 10px, 0) rotate(15deg); } }
    @keyframes ef-tw-f3 { 0%, 100% { transform: translate3d(0, 0, 0) rotate(18deg); } 50% { transform: translate3d(6px, 12px, 0) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) {
      .ef-tw__pc { animation: none; }
      .ef-tw__pc--a { transform: rotate(-10deg); }
      .ef-tw__pc--b { transform: rotate(8deg); }
      .ef-tw__pc--c { transform: rotate(16deg); }
    }

  <script>
    function mount(root, o) {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var wrap = root.querySelector(".ef-tw");
      var canvas = root.querySelector(".ef-tw__c");
      var ctx = canvas.getContext("2d");
      var opts = {}, raf = 0, visible = true, io = null, ro = null, destroyed = false, last = 0, t = 0;
      var W = 1, H = 1, dpr = 1, n = 0, X, Y, PX, PY, AGE, KIND, seed = 90211;
      var mx = -9999, my = -9999, hasPtr = false, bg = [12, 30, 24], acc = [230, 255, 85];
      var PAL = [[10, 107, 70], [47, 125, 91], [198, 242, 107], [251, 248, 241]];
      function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
      function rgb(h, d) { var m = /^#?([0-9a-f]{6})$/i.exec(h || ""); var v = parseInt(m ? m[1] : d, 16); return [v >> 16, (v >> 8) & 255, v & 255]; }
      function hash(i, j) { var h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
      function noise(x, y) { var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
      function size() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = Math.max(1, wrap.clientWidth); H = Math.max(1, wrap.clientHeight); canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); fillBg(1); for (var i = 0; i < n; i++) respawn(i, true); }
      function fillBg(a) { ctx.fillStyle = "rgba(" + bg[0] + "," + bg[1] + "," + bg[2] + "," + a + ")"; ctx.fillRect(0, 0, W, H); }
      function respawn(i, anywhere) { if (anywhere) { X[i] = rnd() * W; Y[i] = rnd() * H; } else if (KIND[i] % 2 === 0) { X[i] = rnd() < 0.5 ? -2 : W + 2; Y[i] = rnd() * H; } else { X[i] = rnd() * W; Y[i] = rnd() < 0.5 ? -2 : H + 2; } PX[i] = X[i]; PY[i] = Y[i]; AGE[i] = rnd() * 400; }
