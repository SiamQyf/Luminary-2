<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Zero • Next-Gen Cloud Runtime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060907;
      color: #4ade80;
      font-family: 'JetBrains Mono', monospace;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }
    .crt-glow {
      position: absolute; width: 900px; height: 500px;
      background: radial-gradient(circle, rgba(74,222,128,0.12) 0%, transparent 65%);
      top: -100px; left: 50%; transform: translateX(-50%); filter: blur(75px); pointer-events: none;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 72px; border-bottom: 1px solid rgba(74,222,128,0.25);
      background: rgba(6,9,7,0.9); position: relative; z-index: 10;
    }
    .logo { font-size: 19px; font-weight: 800; color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,0.5); }
    nav { display: flex; gap: 36px; }
    nav a { color: #86efac; opacity: 0.6; text-decoration: none; font-size: 14px; font-weight: 600; }
    nav a.active { opacity: 1; text-shadow: 0 0 8px #4ade80; }
    .btn-cli { border: 1px solid #4ade80; color: #4ade80; padding: 8px 18px; border-radius: 4px; font-size: 13px; font-weight: 700; text-decoration: none; }
    main { text-align: center; padding: 30px 40px 0; position: relative; z-index: 10; }
    .term-pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 4px; background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.3); font-size: 12.5px; color: #4ade80; margin-bottom: 14px; }
    h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; color: #f0fdf4; text-shadow: 0 0 16px rgba(74,222,128,0.4); }
    .code-cmd { display: inline-block; background: #0c150e; border: 1px solid rgba(74,222,128,0.3); padding: 8px 20px; border-radius: 6px; font-size: 14px; color: #86efac; margin-bottom: 24px; box-shadow: 0 0 14px rgba(74,222,128,0.1); }
    .term-frame {
      width: 1020px; margin: 0 auto; padding: 8px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(74,222,128,0.2), rgba(0,0,0,0.8));
      border: 1px solid rgba(74,222,128,0.35);
      box-shadow: 0 20px 60px rgba(0,0,0,0.95), 0 0 35px rgba(74,222,128,0.15);
    }
    .term-topbar { display: flex; justify-content: space-between; padding: 6px 14px 10px; font-size: 12px; color: #4ade80; }
    iframe { width: 100%; height: 574px; border: none; border-radius: 8px; display: block; background: #000; }
  </style>
</head>
<body>
  <div class="crt-glow"></div>
  <header>
    <div class="logo">&gt;_ TERMINAL ZERO // DEVTOOLS</div>
    <nav><a href="#" class="active">[DEMO]</a><a href="#">[CLI_REFERENCE]</a><a href="#">[SDK_DOCS]</a><a href="#">[BENCHMARKS]</a></nav>
    <a href="#" class="btn-cli">$ term0 deploy</a>
  </header>
  <main>
    <div class="term-pill">KERNEL: V4.18 • STATUS: ONLINE • LATENCY: 0.8MS</div>
    <h1>MICROSECOND CLOUD TELEMETRY & RUNTIME</h1>
    <div class="code-cmd">$ curl -fsSL https://get.term0.dev | bash && term0 init</div>
    <div class="term-frame">
      <div class="term-topbar">
        <span>SESSION: STDOUT // BROADCAST 1080P60</span>
        <span>TELEMETRY: MONOCHROME PHOSPHOR</span>
      </div>
      <iframe id="player-frame" src="/preview.html#scheme=dark&autoplay=1&muted=1&loop=1"></iframe>
    </div>
  </main>
</body>
</html>
