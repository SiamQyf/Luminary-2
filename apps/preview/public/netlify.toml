[build]
  publish = "dist"

[[redirects]]
  from = "/preview"
  to = "/preview.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"
    Access-Control-Allow-Origin = "*"
